name: Apply Android background audio patch and build APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-background-offline-audio
    paths:
      - '.github/patch-parts/**'
      - '.github/workflows/apply-background-offline-audio.yml'

permissions:
  contents: write

concurrency:
  group: sonora-background-audio-patch
  cancel-in-progress: false

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Apply source changes and commit them
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.github/patch-parts/*.b64' > /dev/null; then
            cat .github/patch-parts/part-*.b64 | base64 --decode | xz --decompress --stdout > "$RUNNER_TEMP/sonora-audio.patch"
            git apply --check "$RUNNER_TEMP/sonora-audio.patch"
            git apply "$RUNNER_TEMP/sonora-audio.patch"
            rm -rf .github/patch-parts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Fix Android background playback and offline downloads"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install web dependencies
        run: npm ci

      - name: Build Sonora web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and bundle web build
        run: bash scripts/prepare-flutter-android.sh

      - name: Fetch Flutter packages
        working-directory: flutter_app
        run: flutter pub get

      - name: Build installable Android test APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Verify APK
        run: test -s flutter_app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonora-background-audio-test-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
