name: melodiya_app
description: Flutter Android wrapper for the Sonora music app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  url_launcher: ^6.3.2
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.19
  http: ^1.3.0
  crypto: ^3.0.6
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Vite writes index.html and public files directly under dist/.
    - assets/web/
    # The generated JS/CSS bundles live in dist/assets/ and are required
    # by index.html at runtime. Flutter does not recursively bundle them
    # unless this subdirectory is declared explicitly.
    - assets/web/assets/
